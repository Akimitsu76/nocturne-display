<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="78%">
      <stop offset="0" stop-color="#2b2247"/>
      <stop offset="0.55" stop-color="#151125"/>
      <stop offset="1" stop-color="#07060d"/>
    </radialGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8fff6"/>
      <stop offset="0.42" stop-color="#7ff5e4"/>
      <stop offset="1" stop-color="#38a9c7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b8"/>
      <stop offset="1" stop-color="#a87c3d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="476" height="476" rx="108" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="108" fill="none" stroke="url(#aqua)" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="30" y="30" width="452" height="452" rx="98" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
  <path d="M 62 148 Q 256 34 450 148 L 450 74 Q 256 -34 62 74 Z" fill="url(#glass)" opacity="0.5"/>

  <!-- mystical aura -->
  <circle cx="256" cy="248" r="132" fill="#66e6d8" opacity="0.16" filter="url(#softglow)"/>

  <!-- gothic pointed arch -->
  <path d="M 128 330 L 128 214 Q 128 148 256 82 Q 384 148 384 214 L 384 330"
        fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.75"/>
  <circle cx="256" cy="98" r="9" fill="url(#gold)" filter="url(#glow)"/>
  <path d="M 256 78 L 256 122 M 238 94 L 274 94" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>

  <!-- crescent moon -->
  <path d="M 258 132 A 106 106 0 1 0 344 306 A 84 84 0 1 1 258 132 Z"
        fill="url(#aqua)" filter="url(#glow)" opacity="0.96"/>

  <!-- monitor -->
  <rect x="168" y="206" width="192" height="132" rx="18" fill="#0c0a17" stroke="url(#aqua)" stroke-width="5"/>
  <rect x="182" y="220" width="164" height="104" rx="11" fill="#122b35" opacity="0.9"/>
  <path d="M 182 270 Q 264 226 346 270 L 346 324 L 182 324 Z" fill="#5ad9cf" opacity="0.14"/>
  <path d="M 244 342 L 284 342 L 292 366 L 236 366 Z" fill="url(#aqua)" opacity="0.85"/>
  <rect x="210" y="366" width="108" height="10" rx="5" fill="url(#aqua)" opacity="0.85"/>
  <circle cx="264" cy="272" r="26" fill="none" stroke="#d8fff6" stroke-width="3" opacity="0.65"/>
  <path d="M 264 252 A 20 20 0 1 0 282 288 A 16 16 0 1 1 264 252 Z" fill="#d8fff6" opacity="0.8"/>

  <!-- glints -->
  <circle cx="120" cy="112" r="6" fill="#ffffff" opacity="0.5"/>
  <circle cx="397" cy="150" r="4" fill="#ffffff" opacity="0.4"/>
  <circle cx="404" cy="386" r="3" fill="#7ff5e4" opacity="0.7"/>
</svg>
